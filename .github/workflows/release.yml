# Выпуск: при отправке тега vX.Y.Z собирает программу и публикует Release
# с установщиком, приложением для macOS, архивом и SHA256SUMS.txt (по ним работает автообновление).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Проверка версии
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/.*appVersion = "\([^"]*\)".*/\1/p' app/main.go)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "тег ${GITHUB_REF_NAME} не совпадает с версией $v"; exit 1; }
      - name: Сборка
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build.sh
      - name: Описание выпуска
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$f" ] || { echo "VPN Auto ${GITHUB_REF_NAME}" > /tmp/notes.md; f=/tmp/notes.md; }
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: VPN Auto ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            dist/VPN-Auto-Setup.exe
            dist/VPN-Auto-macOS.zip
            dist/VPN-Auto-*.zip
            dist/SHA256SUMS.txt
