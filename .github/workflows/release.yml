# Выпуск: при каждом изменении в main проверяет версию в app/main.go. Если выпуска
# с такой версией ещё нет — собирает программу и публикует Release (тег vX.Y.Z)
# с установщиком, приложением для macOS, архивом и SHA256SUMS.txt
# (по этим файлам работает автообновление у пользователей).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/.*appVersion = "\([^"]*\)".*/\1/p' app/main.go)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "выпуск v$v уже есть — пропускаю"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.ver.outputs.new == 'true'
        with:
          go-version: "1.24"
      - name: Сборка
        if: steps.ver.outputs.new == 'true'
        run: ./build.sh
      - name: Описание выпуска
        if: steps.ver.outputs.new == 'true'
        id: notes
        run: |
          f="docs/release-notes/${{ steps.ver.outputs.tag }}.md"
          [ -f "$f" ] || { echo "VPN Auto ${{ steps.ver.outputs.tag }}" > /tmp/notes.md; f=/tmp/notes.md; }
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VPN Auto ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            dist/VPN-Auto-Setup.exe
            dist/VPN-Auto-macOS.zip
            dist/VPN-Auto-*.zip
            dist/SHA256SUMS.txt
